aid: faraday-pharmaceuticals
name: Faraday Pharmaceuticals
description: 'Faraday Pharmaceuticals, Inc. was a Seattle, Washington clinical-stage biopharmaceutical
  company founded in 2014 as a spinout of Fred Hutchinson Cancer Center, built on the elemental-reducing-agent
  research of Dr. Mark Roth. It developed therapies intended to prevent and treat cardiac and skeletal
  muscle loss after acute critical illness, led by FDY-5301 — a proprietary intravenous formulation of
  sodium iodide designed to neutralize reactive oxygen species and limit reperfusion injury in patients
  undergoing percutaneous coronary intervention for anterior ST-elevation myocardial infarction (STEMI).
  The company raised roughly $120M from an investor group led by ARCH Venture Partners and Polaris Partners.
  Its Phase 3 trial read out in late 2025 and failed to meet its primary or secondary endpoints, and Faraday
  announced in February 2026 that it had ceased operations and was winding down the business. Faraday never
  operated a developer program, public API, SDK, or machine-readable specification, and its faradaypharma.com
  website is no longer served. This profile is retained as a historical record; there is no API surface to
  enrich.'
